name: Staging Pipeline

# Menentukan kapan pipeline ini berjalan
on:
  push:
    branches: [devel]
  pull_request:
    branches: [devel]
  workflow_dispatch: # Ini adalah padanan dari event 'manual' di Woodpecker

jobs:
  # --- TAHAP 1: CI (Pengujian Otomatis) ---
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    container:
      image: php:8.4-fpm # Berjalan di dalam container PHP 8.4 persis seperti Woodpecker
      options: --dns 1.1.1.1 --dns 8.8.8.8
    steps:
      # Jauh lebih simpel dari Woodpecker! Tidak perlu atur SSH Clone.
      # Action ini otomatis mengambil kodemu menggunakan token internal Forgejo.
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: apt-get update -y && apt-get install -y unzip libzip-dev git libonig-dev libsqlite3-dev

      - name: Install PHP Extensions
        run: docker-php-ext-install pdo pdo_sqlite zip mbstring bcmath

      - name: Install Composer
        run: curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer

      - name: Install Laravel Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare Environment
        run: |
          cp .env.example .env
          php artisan key:generate
          sed -i 's/DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env
          sed -i 's/DB_DATABASE=.*/DB_DATABASE=:memory:/' .env

      - name: Run Tests
        run: php artisan test

  # --- TAHAP 2: CD (Deployment Otomatis ke Server Staging) ---
  deploy-staging:
    name: Deploy to Staging
    needs: test # Wajib menunggu job 'test' selesai dan berhasil
    # Hanya jalankan deploy jika triggernya adalah 'push' atau 'manual' (bukan Pull Request)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Execute Deployment over SSH
        # Ini adalah versi GitHub Actions dari appleboy/drone-ssh
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: 22
          script: |
            cd /srv/projects/backend_rafifah
            git checkout devel
            git pull origin devel
            
            # Eksekusi proses Docker & Laravel
            docker compose up -d --build
            docker compose exec -T app php artisan optimize:clear
            docker compose exec -T app php artisan migrate --force